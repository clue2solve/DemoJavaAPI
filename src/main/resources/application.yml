spring:
  application:
    name: clue2app-java-api-service

  profiles:
    active: default

  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true
    url: /api-docs
  enable-native-support: true

management:
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

clue2app:
  queue:
    enabled: false
    name: my-queue-1
  s3:
    enabled: false
    name: my-storage-1
  postgres:
    enabled: false
    name: my-db-1
  dynamodb:
    enabled: false
    name: my-tbl-1

logging:
  level:
    root: INFO
    io:
      clue2solve: DEBUG
      clue2app: DEBUG

version: @project.version@